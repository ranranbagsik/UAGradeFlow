<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GradeFlow - University of the Assumption Portal</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#002B66', /* UA Blue */
              600: '#002252',
              700: '#00193d',
              800: '#001129',
              900: '#000814',
            },
            ua: {
              blue: '#002B66',
              gold: '#F5A623',
              goldHover: '#E09212',
              lightBlue: '#1E40AF'
            }
          }
        }
      }
    }
  </script>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased selection:bg-brand-500 selection:text-white transition-colors duration-200">
  
  <!-- Root App Shell -->
  <div id="app" class="min-h-screen flex flex-col relative overflow-x-hidden"></div>

  <!-- Global Modal Container -->
  <div id="modalRoot" class="relative z-50"></div>

  <!-- Global Toast Notifications Container -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none"></div>

  <!-- Main JavaScript App Logic -->
  <script src="app.js"></script>
</body>
</html>
